# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Node.js CI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the full upstream compatibility matrix
        type: boolean
        default: false
  pull_request:
    branches: [ "main" ]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix && fromJSON('[{"os":"ubuntu-latest","node-version":"22.x"},{"os":"ubuntu-latest","node-version":"24.x"},{"os":"ubuntu-latest","node-version":"26.x"},{"os":"macos-latest","node-version":"22.x"},{"os":"macos-latest","node-version":"24.x"},{"os":"macos-latest","node-version":"26.x"},{"os":"windows-latest","node-version":"26.x"}]') || fromJSON('[{"os":"ubuntu-latest","node-version":"24.x"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache dependencies and build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            dist/.tsbuildinfo
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
      - run: npm install --prefer-offline --no-audit  --no-fund --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: node cli.mjs --help
      - name: Build WebSerial variant
        run: npm run build:ui
        env:
          IS_WEB: '1'
      - name: Browser UI smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/whiteaxe-ui" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          UI_TEST_MODULES="$RUNNER_TEMP/whiteaxe-ui" node tools/ui-smoke.mjs
      - name: Upload browser screenshots
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: whiteaxe-ui-screenshots
          path: ui-test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: UI typecheck (known upstream baseline debt; advisory)
        continue-on-error: true
        run: npx --no-install tsc --project tsconfig.ui.json --noEmit
permissions:
  contents: read
